<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta Deputados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" crossorigin="anonymous" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <h1 class="text-center mb-4">Consulta de Deputados</h1>

    <div class="input-group mb-3">
      <input type="text" id="inputBusca" class="form-control" placeholder="Digite o nome parlamentar">
      <button class="btn btn-primary" onclick="buscarDeputado()">Buscar</button>
    </div>

    <div id="dadosDeputado" class="form-section d-none">
      <div class="row">
        <div class="col-md-4 text-center">
          <img id="fotoDeputado" class="foto-deputado img-thumbnail" alt="Foto do Deputado">
        </div>
        <div class="col-md-8">
          <form>
            <div class="mb-3">
              <label class="form-label">Nome Completo</label>
              <input type="text" class="form-control" id="nome" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">Partido</label>
              <input type="text" class="form-control" id="partido" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">UF</label>
              <input type="text" class="form-control" id="uf" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="text" class="form-control" id="email" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">Id Legislatura</label>
              <input type="text" class="form-control" id="legislatura" readonly>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="mensagemErro" class="alert alert-danger d-none mt-3"></div>
  </div>

  <script>
    async function buscarDeputado() {
      const nome = document.getElementById('inputBusca').value.trim();
      const dadosDiv = document.getElementById('dadosDeputado');
      const erroDiv = document.getElementById('mensagemErro');
      
      dadosDiv.classList.add('d-none');
      erroDiv.classList.add('d-none');

      if (!nome) {
        erroDiv.textContent = "Digite um nome para buscar.";
        erroDiv.classList.remove('d-none');
        return;
      }

      try {
        const res = await fetch(`https://dadosabertos.camara.leg.br/api/v2/deputados?nome=${encodeURIComponent(nome)}&ordem=ASC&ordenarPor=nome`);
        const dados = await res.json();

        if (dados.dados.length === 0) {
          erroDiv.textContent = "Deputado não encontrado.";
          erroDiv.classList.remove('d-none');
          return;
        }

        const deputado = dados.dados[0];
        const resDetalhes = await fetch(deputado.uri);
        const detalhes = await resDetalhes.json();
        const info = detalhes.dados;

        document.getElementById('nome').value = info.nomeCivil;
        document.getElementById('partido').value = info.ultimoStatus.siglaPartido;
        document.getElementById('uf').value = info.ultimoStatus.siglaUf;
        document.getElementById('email').value = info.ultimoStatus.email || 'Não informado';
        document.getElementById('legislatura').value = info.ultimoStatus.idLegislatura;
        document.getElementById('fotoDeputado').src = info.ultimoStatus.urlFoto;

        dadosDiv.classList.remove('d-none');

      } catch (error) {
        erroDiv.textContent = "Erro ao buscar dados.";
        erroDiv.classList.remove('d-none');
        console.error(error);
      }
    }
  </script>

</body>
</html>
